<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Study Repo Card — MyBibleLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --parchment: #f5f2ed;
        --deep-brown: #3d2b1f;
        --dark-bg: #1a1008;
        --gold: #b6751d;
        --gold-light: #d4921f;
        --halo-gold: #f0c850;
        --line: rgba(61, 43, 31, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--parchment);
        font-family: "Inter", system-ui, sans-serif;
        color: var(--deep-brown);
      }

      .stage {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: clamp(2rem, 6vw, 5rem);
        padding: clamp(3rem, 6vw, 5.5rem) clamp(1.5rem, 5vw, 4rem);
      }

      /* ——— scattered sanctuary stickers (decorative) ——— */
      .stickers {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .sticker {
        position: absolute;
        width: var(--w, 74px);
        filter: drop-shadow(0 10px 16px rgba(61, 43, 31, 0.22));
        animation: sticker-float 7s ease-in-out infinite;
        animation-delay: var(--d, 0s);
      }
      @keyframes sticker-float {
        0%,
        100% {
          transform: translateY(0) rotate(var(--r, 0deg));
        }
        50% {
          transform: translateY(-9px) rotate(calc(var(--r, 0deg) + 1.5deg));
        }
      }
      /* keep the copy + phone above the stickers */
      .copy,
      .phone {
        position: relative;
        z-index: 2;
      }
      /* hide the smaller decorative stickers on narrow screens */
      @media (max-width: 720px) {
        .sticker--hide-sm {
          display: none;
        }
      }

      /* ——— left-hand copy column ——— */
      .copy {
        flex: 1 1 460px;
        max-width: 560px;
      }
      .copy__eyebrow {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 1.1rem;
      }
      .copy__title {
        font-family: "Hammersmith One", sans-serif;
        font-size: clamp(3rem, 2rem + 4vw, 4.8rem);
        line-height: 1.05;
        margin: 0 0 1.4rem;
        text-wrap: balance;
      }
      .copy__title .gold {
        color: var(--gold);
      }
      .copy__body {
        font-size: 1.2rem;
        line-height: 1.65;
        color: rgba(61, 43, 31, 0.78);
        margin: 0 0 1.3rem;
        text-wrap: pretty;
      }
      .copy__body strong {
        color: var(--deep-brown);
        font-weight: 600;
      }
      .copy__kicker {
        font-size: 1.08rem;
        line-height: 1.6;
        font-style: italic;
        color: rgba(61, 43, 31, 0.6);
        margin: 0;
      }

      /* ——— iPhone mockup with the study video ——— */
      .phone {
        position: relative;
        width: clamp(300px, 90vw, 440px);
        aspect-ratio: 1170 / 2428;
        background: #0c0a08;
        border-radius: 46px;
        padding: 11px;
        box-shadow:
          0 0 0 2px #2a2620,
          0 0 0 6px #151210,
          0 40px 80px -24px rgba(61, 43, 31, 0.55),
          0 0 60px -12px rgba(182, 117, 29, 0.35);
      }
      .phone__screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 36px;
        overflow: hidden;
        background: #000;
      }
      .phone__screen video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* Dynamic Island */
      .phone__island {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 34%;
        height: 26px;
        background: #000;
        border-radius: 999px;
        z-index: 3;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <!-- ===== scattered sanctuary stickers ===== -->
      <div class="stickers" aria-hidden="true">
        <img
          class="sticker sticker--hide-sm"
          src="../assets/stickers/el-110-moon-stars.png"
          alt=""
          style="top: 46%; left: 2%; --w: 70px; --r: 7deg; --d: 1.4s"
        />
        <img class="sticker" src="../assets/stickers/hc-07-lion.png" alt="" style="bottom: 6%; left: 3%; --w: 78px; --r: 9deg; --d: 2.2s" />
        <img
          class="sticker sticker--hide-sm"
          src="../assets/stickers/el-74-living-water.png"
          alt=""
          style="top: 44%; right: 1.5%; --w: 76px; --r: -7deg; --d: 1.9s"
        />
        <img
          class="sticker"
          src="../assets/stickers/3d-01-latin-cross.png"
          alt=""
          style="bottom: 20%; right: 2.5%; --w: 66px; --r: 10deg; --d: 2.6s"
        />
        <img
          class="sticker"
          src="../assets/stickers/3d-119-gold-coins.png"
          alt=""
          style="bottom: 5%; right: 4%; --w: 84px; --r: -6deg; --d: 1.1s"
        />
      </div>

      <!-- ===== left-hand copy ===== -->
      <div class="copy">
        <p class="copy__eyebrow">Built around you</p>
        <h2 class="copy__title">Before we <span class="gold">get started.</span></h2>
        <p class="copy__body">
          Customize your homepage however you like. Keep the tools that draw you closer to God, and
          <strong>remove anything you don&rsquo;t want</strong> — nothing is fixed in place.
        </p>
        <p class="copy__kicker">This is your personal sanctuary, shaped for your needs and your needs only.</p>
      </div>

      <!-- ===== iPhone mockup with the study demo video ===== -->
      <div class="phone" aria-label="MyBibleLens study demo">
        <div class="phone__screen">
          <video src="assets/video/study-demo.mp4" autoplay muted loop playsinline preload="metadata"></video>
        </div>
      </div>
    </div>
  </body>
</html>
